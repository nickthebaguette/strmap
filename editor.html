<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Strategy Map Editor</title>

    <link
        rel="stylesheet"
        href="editor.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

</head>

<body>

    <!-- ======================================================
         MAP
         ====================================================== -->

    <canvas id="editorCanvas"></canvas>


    <!-- ======================================================
         TOP TOOLBAR
         ====================================================== -->

    <div id="toolbar">

        <button
            id="tool-select"
            class="tool-button active"
        >
            Select
        </button>


        <button
            id="tool-territory"
            class="tool-button"
        >
            Territory
        </button>


        <button
            id="tool-terrain"
            class="tool-button"
        >
            Terrain
        </button>


        <button
            id="tool-city"
            class="tool-button"
        >
            City
        </button>


        <button
            id="tool-army"
            class="tool-button"
        >
            Army
        </button>

    </div>


    <!-- ======================================================
         EDITOR PANEL
         
         This starts hidden.
         Only the currently selected tool opens it.
         ====================================================== -->

    <div id="editor-panel">


        <!-- ==================================================
             TERRITORY PANEL
             ================================================== -->

        <div
            id="territory-editor"
            class="tool-panel"
        >

            <h2>Territory</h2>

            <label for="country-select">
                Country
            </label>

            <select id="country-select"></select>

            <p class="hint">
                Click a hex to change its owner.
            </p>

        </div>


        <!-- ==================================================
             TERRAIN PANEL
             ================================================== -->

        <div
            id="terrain-editor"
            class="tool-panel"
        >

            <h2>Terrain</h2>

            <label for="terrain-select">
                Terrain
            </label>

            <select id="terrain-select">

                <option value="plains">
                    Plains
                </option>

                <option value="forest">
                    Forest
                </option>

                <option value="hills">
                    Hills
                </option>

                <option value="mountains">
                    Mountains
                </option>

                <option value="desert">
                    Desert
                </option>

                <option value="swamp">
                    Swamp
                </option>

            </select>

            <p class="hint">
                Click a land hex to apply terrain.
            </p>

        </div>


        <!-- ==================================================
             CITY PANEL
             ================================================== -->

        <div
            id="city-editor"
            class="tool-panel"
        >

            <h2>City</h2>


            <label for="city-name">
                Name
            </label>

            <input
                id="city-name"
                type="text"
                placeholder="City name"
            >


            <label for="city-country">
                Country
            </label>

            <select id="city-country"></select>


            <div class="panel-buttons">

                <button id="city-place">
                    Place / Update
                </button>

                <button
                    id="city-delete"
                    class="danger"
                >
                    Delete
                </button>

            </div>


            <p class="hint">
                Select a hex on the map, then place or update the city.
            </p>

        </div>


        <!-- ==================================================
             ARMY PANEL
             ================================================== -->

        <div
            id="army-editor"
            class="tool-panel"
        >

            <h2>Army</h2>


            <label for="army-name">
                Name
            </label>

            <input
                id="army-name"
                type="text"
                placeholder="Army name"
            >


            <label for="army-country">
                Country
            </label>

            <select id="army-country"></select>


            <label for="army-strength">
                Strength
            </label>

            <input
                id="army-strength"
                type="number"
                min="0"
                value="0"
            >


            <div class="panel-buttons">

                <button id="army-place">
                    Place / Update
                </button>

                <button
                    id="army-delete"
                    class="danger"
                >
                    Delete
                </button>

            </div>


            <p class="hint">
                Select a hex on the map, then place or update the army.
            </p>

        </div>


    </div>


    <!-- ======================================================
         SELECTION INFORMATION
         ====================================================== -->

    <div id="selection-panel">

        <div id="selected-tile">
            Position: None
        </div>

        <div id="selected-territory">
            Territory: None
        </div>

        <div id="selected-terrain">
            Terrain: None
        </div>

        <div id="selected-entity">
            Entity: None
        </div>

    </div>


    <!-- ======================================================
         STATUS
         ====================================================== -->

    <div id="status">
        Loading editor...
    </div>


    <!-- ======================================================
         DOWNLOAD PANEL
         ====================================================== -->

    <div id="download-panel">

        <button id="download-map">
            Map
        </button>

        <button id="download-terrain">
            Terrain
        </button>

        <button id="download-cities">
            Cities
        </button>

        <button id="download-armies">
            Armies
        </button>

    </div>


    <!-- ======================================================
         SCRIPT
         ====================================================== -->

    <script
        type="module"
        src="js/editor.js"
    ></script>

</body>

</html>
