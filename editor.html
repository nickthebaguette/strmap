<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Strategy Map Editor</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <canvas id="map"></canvas>


    <div id="editor-panel">

        <h2>Map Editor</h2>


        <!-- ================================================= -->
        <!-- EDITOR MODE -->
        <!-- ================================================= -->

        <div class="editor-section">

            <strong>Editor Mode</strong>

            <select id="editor-mode">

                <option value="territory">
                    Territory
                </option>

                <option value="city">
                    City
                </option>

                <option value="army">
                    Army
                </option>

            </select>

        </div>


        <!-- ================================================= -->
        <!-- TERRITORY CONTROLS -->
        <!-- ================================================= -->

        <div
            class="editor-section"
            id="territory-controls"
        >

            <strong>Country</strong>

            <select id="country-select">

                <option value="ocean">
                    Ocean
                </option>

                <option value="france">
                    France
                </option>

                <option value="spain">
                    Spain
                </option>

                <option value="portugal">
                    Portugal
                </option>

                <option value="britain">
                    Great Britain
                </option>

                <option value="batavia">
                    Batavian Republic
                </option>

                <option value="prussia">
                    Prussia
                </option>

                <option value="austria">
                    Austria
                </option>

                <option value="russia">
                    Russian Empire
                </option>

                <option value="sweden">
                    Sweden
                </option>

                <option value="denmark">
                    Denmark-Norway
                </option>

                <option value="italy">
                    Kingdom of Italy
                </option>

                <option value="ottoman">
                    Ottoman Empire
                </option>

                <option value="switzerland">
                    Switzerland
                </option>

                <option value="bavaria">
                    Bavaria
                </option>

                <option value="saxony">
                    Saxony
                </option>

                <option value="naples">
                    Naples
                </option>

                <option value="papal">
                    Papal States
                </option>

            </select>

        </div>


        <!-- ================================================= -->
        <!-- CITY CONTROLS -->
        <!-- ================================================= -->

        <div
            class="editor-section"
            id="city-controls"
            style="display: none;"
        >

            <strong>City Mode</strong>

            <p>
                Click a hex to place or select a city.
            </p>

        </div>


        <!-- ================================================= -->
        <!-- ARMY CONTROLS -->
        <!-- ================================================= -->

        <div
            class="editor-section"
            id="army-controls"
            style="display: none;"
        >

            <strong>Army Mode</strong>

            <p>
                Click a hex to place or select an army.
            </p>

        </div>


        <!-- ================================================= -->
        <!-- SAVE -->
        <!-- ================================================= -->

        <div class="editor-section">

            <button id="save-button">
                Save Local Copy
            </button>

            <button id="download-button">
                Download map.json
            </button>

        </div>


        <!-- ================================================= -->
        <!-- STATUS -->
        <!-- ================================================= -->

        <div class="editor-section">

            <p id="status">
                Unsaved changes
            </p>

        </div>

    </div>


    <script src="editor.js"></script>

</body>

</html>
