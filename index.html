<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strategy Map</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Quintessential font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Quintessential&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <canvas id="map"></canvas>


   <!-- ==================================================
     LOADING OVERLAY
     ================================================== -->
    
    <div id="loading-overlay">
    
        <img
            id="loading-painting"
            src=""
            alt=""
        >
    
        <div id="loading-vignette"></div>
    
    
        <div
            id="loading-quote"
            class="loading-quote"
            style="display: none;"
        >
    
            <div
                id="loading-quote-text"
                class="loading-quote-text"
            ></div>
    
            <div
                id="loading-quote-author"
                class="loading-quote-author"
            ></div>
    
        </div>
    
    
        <div
            id="loading-prompt"
            class="loading-prompt"
        >
            Click to begin
        </div>
    
    
        <div
            id="loading-painting-info"
            class="loading-painting-info"
            style="display: none;"
        >
    
            <div
                id="loading-painting-title"
                class="loading-painting-title"
            ></div>
    
            <div
                id="loading-painting-artist"
                class="loading-painting-artist"
            ></div>
    
        </div>
    
    </div>

    <!-- ==================================================
         DATE DISPLAY
         ================================================== -->

    <div
        id="date-display"
        class="date-display"
        style="display: none;"
    >
        January 1805
    </div>


    <!-- ==================================================
         COMPASS ROSE
         ================================================== -->

    <div
        id="compass-rose"
        class="compass-rose"
        style="display: none;"
    >

        <div class="compass-circle">

            <div class="compass-north">
                N
            </div>

            <div class="compass-east">
                E
            </div>

            <div class="compass-south">
                S
            </div>

            <div class="compass-west">
                W
            </div>

            <div class="compass-needle"></div>

        </div>

    </div>


    <div id="territory-panel">

        <div id="territory-header">

            <div id="territory-text">

                <h2 id="territory-name">
                    No territory selected
                </h2>

                <p id="territory-owner"></p>

            </div>


            <img
                id="territory-flag"
                src=""
                alt=""
            >

        </div>


        <!-- ==================================================
             ARMY NAME DISPLAY
             ================================================== -->

        <div
            id="territory-army"
            class="army-section"
            style="display: none;"
        >

            <div class="army-label">
                Army
            </div>

            <div
                id="army-name-display"
                class="army-name-display"
            ></div>

            <div
                id="army-strength-display"
                class="army-strength-display"
            ></div>

        </div>


        <!-- ==================================================
             MANPOWER DISPLAY
             ================================================== -->

        <div
            id="territory-manpower"
            class="manpower-section"
            style="display: none;"
        >

            <div class="manpower-label">
                Manpower
            </div>

            <div
                id="manpower-icons"
                class="manpower-icons"
            >

                <div
                    class="soldier-icon"
                    data-index="0"
                ></div>

                <div
                    class="soldier-icon"
                    data-index="1"
                ></div>

                <div
                    class="soldier-icon"
                    data-index="2"
                ></div>

                <div
                    class="soldier-icon"
                    data-index="3"
                ></div>

            </div>

        </div>

    </div>


    <!-- ==================================================
         HOVER TOOLTIP
         ================================================== -->

    <div
        id="hover-tooltip"
        style="display: none;"
    >

        <div
            id="tooltip-country"
            class="tooltip-country"
        ></div>

        <div
            id="tooltip-city"
            class="tooltip-city"
        ></div>

        <div
            id="tooltip-army"
            class="tooltip-army"
        ></div>

        <div
            id="tooltip-manpower"
            class="tooltip-manpower"
        ></div>

    </div>


    <!-- ==================================================
         CINEMATIC SOUND
         ================================================== -->

    <audio
        id="cinematic-sound"
        src="assets/sounds/cinematic.mp3"
        preload="auto"
    ></audio>


    <script type="module" src="js/main.js"></script>
    <script src="music.js"></script>

</body>
</html>
