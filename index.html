<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strategy Map</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

    <canvas id="map"></canvas>


    <div id="territory-panel">

        <div id="territory-header">

            <div id="territory-text">

                <h2 id="territory-name">
                    No territory selected
                </h2>

                <p id="territory-owner"></p>

            </div>


            <img
                id="territory-flag"
                src=""
                alt=""
            >

        </div>


        <!-- ==================================================
             ARMY NAME DISPLAY
             ================================================== -->

        <div
            id="territory-army"
            class="army-section"
            style="display: none;"
        >

            <div class="army-label">
                Army
            </div>

            <div
                id="army-name-display"
                class="army-name-display"
            ></div>

            <div
                id="army-strength-display"
                class="army-strength-display"
            ></div>

        </div>


        <!-- ==================================================
             MANPOWER DISPLAY
             ================================================== -->

        <div
            id="territory-manpower"
            class="manpower-section"
            style="display: none;"
        >

            <div class="manpower-label">
                Manpower
            </div>

            <div
                id="manpower-icons"
                class="manpower-icons"
            >

                <span
                    class="soldier-icon"
                    data-index="0"
                >
                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="12"
                            cy="3.5"
                            r="2.2"
                            fill="currentColor"
                        />
                        <path
                            d="M6.5 8.5L8.5 5.5L15.5 5.5L17.5 8.5L15 10L13.5 9.5L13.5 14L16 14L16 18L13 18L13 22L11 22L11 18L8 18L8 14L10.5 14L10.5 9.5L9 10L6.5 8.5Z"
                            fill="currentColor"
                        />
                    </svg>
                </span>

                <span
                    class="soldier-icon"
                    data-index="1"
                >
                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="12"
                            cy="3.5"
                            r="2.2"
                            fill="currentColor"
                        />
                        <path
                            d="M6.5 8.5L8.5 5.5L15.5 5.5L17.5 8.5L15 10L13.5 9.5L13.5 14L16 14L16 18L13 18L13 22L11 22L11 18L8 18L8 14L10.5 14L10.5 9.5L9 10L6.5 8.5Z"
                            fill="currentColor"
                        />
                    </svg>
                </span>

                <span
                    class="soldier-icon"
                    data-index="2"
                >
                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="12"
                            cy="3.5"
                            r="2.2"
                            fill="currentColor"
                        />
                        <path
                            d="M6.5 8.5L8.5 5.5L15.5 5.5L17.5 8.5L15 10L13.5 9.5L13.5 14L16 14L16 18L13 18L13 22L11 22L11 18L8 18L8 14L10.5 14L10.5 9.5L9 10L6.5 8.5Z"
                            fill="currentColor"
                        />
                    </svg>
                </span>

                <span
                    class="soldier-icon"
                    data-index="3"
                >
                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="12"
                            cy="3.5"
                            r="2.2"
                            fill="currentColor"
                        />
                        <path
                            d="M6.5 8.5L8.5 5.5L15.5 5.5L17.5 8.5L15 10L13.5 9.5L13.5 14L16 14L16 18L13 18L13 22L11 22L11 18L8 18L8 14L10.5 14L10.5 9.5L9 10L6.5 8.5Z"
                            fill="currentColor"
                        />
                    </svg>
                </span>

            </div>

        </div>

    </div>


    <script type="module" src="js/main.js"></script>
    <script src="music.js"></script>

</body>
</html>
