<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strategy Map</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

    <canvas id="map"></canvas>


    <div id="territory-panel">

        <div id="territory-header">

            <div id="territory-text">

                <h2 id="territory-name">
                    No territory selected
                </h2>

                <p id="territory-owner"></p>

            </div>


            <img
                id="territory-flag"
                src=""
                alt=""
            >

        </div>


        <!-- ==================================================
             ARMY NAME DISPLAY
             ================================================== -->

        <div
            id="territory-army"
            class="army-section"
            style="display: none;"
        >

            <div class="army-label">
                Army
            </div>

            <div
                id="army-name-display"
                class="army-name-display"
            ></div>

            <div
                id="army-strength-display"
                class="army-strength-display"
            ></div>

        </div>


        <!-- ==================================================
             MANPOWER DISPLAY
             ================================================== -->

        <div
            id="territory-manpower"
            class="manpower-section"
            style="display: none;"
        >

            <div class="manpower-label">
                Manpower
            </div>

            <div
                id="manpower-icons"
                class="manpower-icons"
            >

                <img
                    class="soldier-icon"
                    src="icons/misc/strengthunit.png"
                    alt=""
                    data-index="0"
                >

                <img
                    class="soldier-icon"
                    src="icons/misc/strengthunit.png"
                    alt=""
                    data-index="1"
                >

                <img
                    class="soldier-icon"
                    src="icons/misc/strengthunit.png"
                    alt=""
                    data-index="2"
                >

                <img
                    class="soldier-icon"
                    src="icons/misc/strengthunit.png"
                    alt=""
                    data-index="3"
                >

            </div>

        </div>

    </div>


    <script type="module" src="js/main.js"></script>
    <script src="music.js"></script>

</body>
</html>
